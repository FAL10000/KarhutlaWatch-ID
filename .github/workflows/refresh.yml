name: Refresh FIRMS analytics

on:
  workflow_dispatch:

  schedule:
    # Refresh today's NRT snapshot every 3 hours
    - cron: "15 */3 * * *"
      timezone: "Asia/Jakarta"

    # Finalize the previous UTC acquisition day once each morning
    - cron: "15 8 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: karhutlawatch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --locked

      - name: Download previous analytics snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m karhutlawatch.release_data download

      - name: Download administrative boundaries
        run: uv run python scripts/download_boundaries.py

      - name: Finalize previous day
        if: github.event_name == 'schedule' && github.event.schedule == '15 8 * * *'
        run: |
          YESTERDAY=$(date -u -d 'yesterday' +%F)

          echo "Finalizing FIRMS data for $YESTERDAY"

          uv run python -m karhutlawatch.refresh --date "$YESTERDAY"

      - name: Refresh analytics
        run: uv run python -m karhutlawatch.refresh

      - name: Package analytics snapshot
        run: uv run python -m karhutlawatch.release_data pack

      - name: Publish analytics snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TAG="analytics-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          gh release create "$TAG" dist/analytics.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Analytics snapshot $TAG" \
            --notes "Automated rolling analytics snapshot." \
            --draft

          gh release edit "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --draft=false \
            --latest

      - name: Remove older analytics snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          gh release list \
            --repo "$GITHUB_REPOSITORY" \
            --limit 100 \
            --json tagName,publishedAt,isDraft,isPrerelease,isLatest \
            --jq '
              map(select(
                (.tagName | startswith("analytics-"))
                and (.isDraft == false)
                and (.isPrerelease == false)
              ))
              | sort_by(.publishedAt)
              | reverse
              | .[20:][]
              | select(.isLatest == false)
              | .tagName
            ' > "$RUNNER_TEMP/old-analytics-releases.txt"

          if [[ ! -s "$RUNNER_TEMP/old-analytics-releases.txt" ]]; then
            echo "No older analytics snapshots to remove."
            exit 0
          fi

          while IFS= read -r tag; do
            echo "Removing old snapshot: $tag"

            gh release delete "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --cleanup-tag \
              --yes
          done < "$RUNNER_TEMP/old-analytics-releases.txt"
