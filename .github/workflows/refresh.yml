name: Refresh FIRMS analytics

on:
  workflow_dispatch:

  schedule:
    - cron: "15 */3 * * *"
      timezone: "Asia/Jakarta"

permissions:
  contents: write

concurrency:
  group: karhutlawatch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install project
        run: uv sync --locked

      - name: Download administrative boundaries
        run: uv run python scripts/download_boundaries.py

      - name: Refresh analytics
        run: uv run python -m karhutlawatch.refresh

      - name: Show changes
        run: git status --short

      - name: Commit updated analytics
        run: |
          if git diff --quiet -- data/analytics; then
            echo "No analytics changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/analytics/*.parquet

          git commit -m "data: refresh FIRMS analytics $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push